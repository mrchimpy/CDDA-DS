name: CDDA-DS Android test
run-name: CDDA-DS build ${{ github.run_number }} (${{ inputs.experiment }}, ${{ inputs.signing_mode }})

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Select baseline or an incremental read-only HUD experiment.
        type: choice
        required: true
        default: baseline
        options:
          - baseline
          - stamina_probe
          - body_status
          - core_status
          - activity_status
          - environment_status
          - equipment_status
          - body_details
      signing_mode:
        description: Persistent for normal iteration; disposable requires reinstalling between builds.
        type: choice
        required: true
        default: persistent
        options:
          - persistent
          - disposable
      use_cache:
        description: Reuse dependency/compiler caches. Uncheck for a clean comparison build.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cdda-ds-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: ARM64 test APK
    if: github.repository == 'mrchimpy/CDDA-DS' && github.ref == 'refs/heads/ds-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASELINE_SHA: bb52239dee96df602da097f113382fe5c9a9c115
      BASELINE_TAG: cdda-experimental-2026-10-19-0834
      UPSTREAM_BUILD_NUMBER: ${{ github.run_number }}
      DS_SIGNING_MODE: ${{ inputs.signing_mode }}
      DS_USE_CACHE: ${{ inputs.use_cache }}
      DS_EXPERIMENT: ${{ inputs.experiment }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out the requested development revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize the compiler cache path on the runner
        shell: bash
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env expressions.
          # Export the actual runtime path for all subsequent steps instead.
          printf 'CCACHE_DIR=%s/ds-ccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify original source before applying explicit overlays
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git diff --exit-code "$BASELINE_SHA" HEAD -- src data gfx lang android
          python3 -m unittest discover -s build-scripts/ds -p 'test_*.py' -v
          mkdir -p dist
          {
            echo "project: CDDA-DS (unofficial baseline test)"
            echo "source: $(git rev-parse HEAD)"
            echo "source_url: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "upstream_baseline: $BASELINE_SHA"
            echo "upstream_tag: $BASELINE_TAG"
            echo "run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "signing_mode: $DS_SIGNING_MODE"
            echo "caches_requested: $DS_USE_CACHE"
            echo "experiment: $DS_EXPERIMENT"
          } > dist/BUILD-INFO.txt

      - name: Prepare signing (fail early if persistent secrets are missing)
        shell: bash
        env:
          DS_TEST_KEYSTORE_BASE64: ${{ secrets.DS_TEST_KEYSTORE_BASE64 }}
          DS_TEST_STORE_PASSWORD: ${{ secrets.DS_TEST_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 build-scripts/ds/configure_signing.py \
            --mode "$DS_SIGNING_MODE" --temporary "$RUNNER_TEMP" --report dist/SIGNING.json

      - name: Restore downloaded Gradle dependencies only
        continue-on-error: true
        if: inputs.use_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (pinned)
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ds-gradle-v1-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}

      - name: Restore native compiler cache
        continue-on-error: true
        if: inputs.use_cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (pinned)
        with:
          path: ${{ runner.temp }}/ds-ccache
          key: ds-native-v1-${{ runner.os }}-${{ hashFiles('android/gradle.properties', 'android/app/build.gradle', 'android/app/jni/CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ds-native-v1-${{ runner.os }}-${{ hashFiles('android/gradle.properties', 'android/app/build.gradle', 'android/app/jni/CMakeLists.txt') }}-

      - name: Install the pinned Android toolchain and compiler cache
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > "$RUNNER_TEMP/ds-sdk-licenses.log" 2>&1
          license_result=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_result" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709' 'cmake;3.22.1'
          sudo apt-get update
          sudo apt-get install -y gettext ninja-build ccache
          ccache --zero-stats
          ccache --show-config > "$RUNNER_TEMP/ds-ccache-config.log"

      - name: Prepare verified baseline resources and side-by-side identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "https://github.com/CleverRaven/Cataclysm-DDA/releases/download/$BASELINE_TAG/cdda-android-x64-2026-10-19-0834.apk" \
            --output "$RUNNER_TEMP/cdda-baseline.apk"
          python3 build-scripts/ds/prepare_android.py \
            --apk "$RUNNER_TEMP/cdda-baseline.apk" --report dist/PREPARATION.json
          git diff -- android > dist/PACKAGING-OVERLAY.patch
          cp doc/dual-screen/ANDROID_BUILD.md dist/README.md
          mkdir -p dist/licenses
          cp LICENSE* dist/licenses/
          printf 'CDDA-DS baseline test\nSource: %s\nBaseline: %s\n' "$GITHUB_SHA" "$BASELINE_SHA" > VERSION.txt

      - name: Apply the selected experiment (baseline is unchanged)
        shell: bash
        run: |
          set -euo pipefail
          case "$DS_EXPERIMENT" in
            baseline) ;;
            stamina_probe)
              python3 build-scripts/ds/apply_stamina_probe.py --output dist
              cp doc/dual-screen/STAMINA_PROBE.md dist/PROBE-README.md
              ;;
            body_status)
              python3 build-scripts/ds/apply_body_status.py --output dist
              cp doc/dual-screen/BODY_STATUS.md dist/PROBE-README.md
              ;;
            core_status)
              python3 build-scripts/ds/apply_core_status.py --output dist
              cp doc/dual-screen/CORE_STATUS.md dist/PROBE-README.md
              ;;
            activity_status)
              python3 build-scripts/ds/apply_activity_status.py --output dist
              cp doc/dual-screen/ACTIVITY_STATUS.md dist/PROBE-README.md
              ;;
            environment_status)
              python3 build-scripts/ds/apply_environment_status.py --output dist
              cp doc/dual-screen/ENVIRONMENT_STATUS.md dist/PROBE-README.md
              ;;
            equipment_status)
              python3 build-scripts/ds/apply_equipment_status.py --output dist
              cp doc/dual-screen/EQUIPMENT_STATUS.md dist/PROBE-README.md
              ;;
            body_details)
              python3 build-scripts/ds/apply_body_details.py --output dist
              cp doc/dual-screen/BODY_DETAILS.md dist/PROBE-README.md
              ;;
            *) echo 'Unknown experiment selection' >&2; exit 1 ;;
          esac

      - name: Compile and package ARM64 from source
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "$DS_USE_CACHE" != 'true' ]; then
            export CCACHE_DISABLE=1
          fi
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            -Pj=2 -Plocalize=false \
            -Pabi_arm_32=false -Pabi_arm_64=true -Pabi_x86_32=false -Pabi_x86_64=false \
            "-Poverride_version=DS-${DS_EXPERIMENT}-${GITHUB_SHA:0:12}-ci${GITHUB_RUN_NUMBER}" \
            assembleExperimentalRelease 2>&1 | tee "$RUNNER_TEMP/ds-gradle.log"

      - name: Record compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            mkdir -p dist
            ccache --show-stats | tee dist/CCACHE-STATS.txt
          fi

      - name: Verify the APK, record its signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/experimental/release/*.apk)
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "${apks[0]}" > dist/SIGNATURE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('dist/SIGNING.json').read_text())['certificate_sha256']
          lines = Path('dist/SIGNATURE.txt').read_text().splitlines()
          actual = [line.split(': ', 1)[1].strip().lower() for line in lines
                    if line.startswith('Signer #1 certificate SHA-256 digest: ')]
          if actual != [expected]:
              raise SystemExit('APK certificate does not match the selected signing key')
          PY
          "$tools/aapt" dump badging "${apks[0]}" > dist/APK-BADGING.txt
          grep -Fq "package: name='io.github.mrchimpy.cddads.experimental'" dist/APK-BADGING.txt
          grep -Fxq "native-code: 'arm64-v8a'" dist/APK-BADGING.txt
          "$tools/aapt" dump xmltree "${apks[0]}" AndroidManifest.xml > dist/APK-MANIFEST.txt
          grep -Fq 'io.github.mrchimpy.cddads.experimental.documents' dist/APK-MANIFEST.txt
          if grep -Fq 'com.cleverraven.cataclysmdda.documents' dist/APK-MANIFEST.txt; then
            echo 'ERROR: official document-provider authority is still present' >&2
            exit 1
          fi
          cp "${apks[0]}" "dist/CDDA-DS-arm64-test-${GITHUB_RUN_NUMBER}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo '## Test APK built'
            echo "Experiment: $DS_EXPERIMENT"
            echo 'HUD experiments retain the upper sidebar; full migration is not complete.'
            echo 'baseline has no second-screen code.'
            echo "Signing mode: $DS_SIGNING_MODE"
            echo 'Use a fresh test-app install after backing up wanted data; keep signing secrets unchanged.'
            echo 'In-place update/data migration remains unresolved despite persistent signing.'
            echo 'Keep the official CDDA installation. Continue using disposable test worlds.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private signing material before publishing artifacts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cdda-ds-test.p12" android/keystore.properties

      - name: Save successful native compiler cache
        continue-on-error: true
        if: success() && inputs.use_cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (pinned)
        with:
          path: ${{ runner.temp }}/ds-ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Upload the test APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CDDA-DS-arm64-test-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CDDA-DS-build-log-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ds-gradle.log
            ${{ runner.temp }}/ds-sdk-licenses.log
            ${{ runner.temp }}/ds-ccache-config.log
          if-no-files-found: ignore
          retention-days: 7
